<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probabilistic Destructuration Analyser — Structured Clays</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-muted: #f1f0ec;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.18);
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --accent: #2a78d6;
    --danger: #a32d2d;
    --radius: 8px;
    --font-mono: 'Courier New', Courier, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1a1a19;
      --surface-muted: #222220;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
    }
  }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  #app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  header { margin-bottom: 2rem; border-bottom: 0.5px solid var(--border-strong); padding-bottom: 1.25rem; }
  header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  header p { font-size: 13px; color: var(--text-secondary); }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 14px; }
  .slider-row { margin-bottom: 18px; }
  .slider-row label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .slider-row .val { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .run-btn {
    width: 100%; padding: 9px 0; margin-top: 6px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .run-btn:hover { opacity: 0.88; }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .output-col { display: flex; flex-direction: column; gap: 16px; }
  .placeholder { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 3rem 2rem; text-align: center; color: var(--text-muted); font-size: 13px; }
  .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  @media (max-width: 560px) { .summary-grid { grid-template-columns: 1fr; } }
  .metric { background: var(--surface-muted); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; }
  .metric .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .metric .value { font-size: 22px; font-weight: 600; font-family: var(--font-mono); }
  .metric .value.danger { color: #c0392b; }
  .metric .top-param { font-size: 14px; font-weight: 600; }
  .legend-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 0.5px solid var(--border); font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { useState, useCallback } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, Cell, ResponsiveContainer } = Recharts;

function randn() {
  const u1 = Math.random() + 1e-12, u2 = Math.random();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function sampleLognormal(mean, cv) {
  const s2 = Math.log(1 + cv * cv);
  return Math.exp(Math.log(mean) - s2 / 2 + Math.sqrt(s2) * randn());
}
function sampleNormalTruncated(mean, std) {
  let v; do { v = mean + std * randn(); } while (v <= 0); return v;
}
function sampleBeta(a, b, low, high) {
  let x, y;
  do { x = Math.random() + 1e-12; y = Math.random() + 1e-12; } while (Math.pow(x,1/a) + Math.pow(y,1/b) > 1);
  const beta = Math.pow(x,1/a) / (Math.pow(x,1/a) + Math.pow(y,1/b));
  return low + beta * (high - low);
}
function ranks(arr) {
  const sorted = [...arr].map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
  const r = new Array(arr.length);
  sorted.forEach(([,idx],rank) => r[idx] = rank+1);
  return r;
}
function spearman(x, y) {
  const n = x.length, rx = ranks(x), ry = ranks(y);
  let d2 = 0; for (let i=0;i<n;i++) d2 += (rx[i]-ry[i])**2;
  return 1 - (6*d2)/(n*(n*n-1));
}
function runMonteCarlo(params, N=1000, maxCycles=50) {
  const p_ref=100, s_0=50, kappa_s=0.3, xi_mean=10.0, b_crit=0.05;
  const cyclesToFail = new Array(N).fill(maxCycles+1);
  const sp = {b0:[],eta:[],ocr:[],ds:[],xi:[]};
  for (let i=0;i<N;i++) {
    const b0=sampleBeta(2,2,0.5,1.0), eta=sampleLognormal(params.eta,0.25),
          ocr=sampleLognormal(params.ocr,0.15), ds=sampleNormalTruncated(params.ds,params.ds*0.20),
          xi=sampleLognormal(xi_mean,0.30);
    sp.b0.push(b0); sp.eta.push(eta); sp.ocr.push(ocr); sp.ds.push(ds); sp.xi.push(xi);
    let b=b0;
    for (let c=1;c<=maxCycles;c++) {
      const dep = eta*(ds/(p_ref+s_0))*Math.pow(ocr,-kappa_s);
      b = Math.max(0, b + (-xi*b*dep));
      if (b<=b_crit){ cyclesToFail[i]=c; break; }
    }
  }
  return {cyclesToFail, sp};
}

function App() {
  const [b0,setB0]=useState(0.75), [eta,setEta]=useState(0.05), [ocr,setOcr]=useState(15), [ds,setDs]=useState(80);
  const [result,setResult]=useState(null), [running,setRunning]=useState(false);

  const run = useCallback(()=>{
    setRunning(true);
    setTimeout(()=>{
      const N=1000, maxCycles=50;
      const {cyclesToFail,sp} = runMonteCarlo({eta,ocr,ds}, N, maxCycles);
      const probCurve = Array.from({length:maxCycles},(_,i)=>({
        cycle:i+1, probability:+(cyclesToFail.filter(v=>v<=i+1).length/N).toFixed(4)
      }));
      const keys=['b0','eta','ocr','ds','xi'], labels=['Bond index b₀','Fissure density η','OCR','Suction Δs','Rate ξ'];
      const tornadoData = keys.map((k,i)=>({name:labels[i], correlation:+spearman(sp[k],cyclesToFail).toFixed(3)}))
        .sort((a,b)=>Math.abs(b.correlation)-Math.abs(a.correlation));
      const failed=cyclesToFail.filter(v=>v<=maxCycles).sort((a,b)=>a-b);
      const pFail=+(failed.length/N).toFixed(3);
      const medCycle=failed.length>0?failed[Math.floor(failed.length/2)]:null;
      setResult({probCurve,tornadoData,pFail,medCycle,topParam:tornadoData[0].name});
      setRunning(false);
    },10);
  },[eta,ocr,ds]);

  const DARK = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = DARK ? '#2c2c2a' : '#e1e0d9';
  const tickColor = '#898781';

  const SL = ({label,val,min,max,step,set,fmt}) =>
    React.createElement('div',{className:'slider-row'},
      React.createElement('label',null, label, React.createElement('span',{className:'val'}, fmt?fmt(val):val)),
      React.createElement('input',{type:'range',min,max,step,value:val,onChange:e=>set(+e.target.value)}));

  return React.createElement('div',null,
    React.createElement('header',null,
      React.createElement('h1',null,'Probabilistic Destructuration Analyser'),
      React.createElement('p',null,'S-CLAY1S bond degradation framework · Monte Carlo (N = 1 000) · ',
        React.createElement('a',{href:'https://doi.org/10.1680/geot.2005.55.3.225',target:'_blank',rel:'noreferrer'},'Wheeler et al. 2003'))
    ),
    React.createElement('div',{className:'layout'},
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'section-label'},'Input parameters'),
        React.createElement(SL,{label:'Initial bond strength b₀',val:b0,min:0.5,max:1.0,step:0.05,set:setB0,fmt:v=>v.toFixed(2)}),
        React.createElement(SL,{label:'Fissure density η',val:eta,min:0.01,max:0.20,step:0.01,set:setEta,fmt:v=>v.toFixed(2)}),
        React.createElement(SL,{label:'Overconsolidation ratio (OCR)',val:ocr,min:2,max:30,step:1,set:setOcr}),
        React.createElement(SL,{label:'Suction amplitude Δs (kPa)',val:ds,min:10,max:200,step:10,set:setDs}),
        React.createElement('button',{className:'run-btn',onClick:run,disabled:running}, running?'Running…':'Run Monte Carlo (N = 1 000)')
      ),
      React.createElement('div',{className:'output-col'},
        !result && React.createElement('div',{className:'placeholder'},'Set parameters and click Run to see results.'),
        result && React.createElement('div',{className:'card'},
          React.createElement('div',{className:'section-label'},'Probability of full destructuration vs. wetting-drying cycles'),
          React.createElement(ResponsiveContainer,{width:'100%',height:230},
            React.createElement(LineChart,{data:result.probCurve,margin:{top:6,right:20,bottom:20,left:0}},
              React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:gridColor}),
              React.createElement(XAxis,{dataKey:'cycle',tick:{fontSize:11,fill:tickColor},label:{value:'Wetting-drying cycle',position:'insideBottom',offset:-12,fontSize:11,fill:tickColor}}),
              React.createElement(YAxis,{domain:[0,1],tickFormatter:v=>v.toFixed(1),tick:{fontSize:11,fill:tickColor},label:{value:'P(destructuration)',angle:-90,position:'insideLeft',offset:14,fontSize:11,fill:tickColor}}),
              React.createElement(Tooltip,{formatter:(v)=>[v.toFixed(3),'P'],labelFormatter:l=>`Cycle ${l}`}),
              React.createElement(ReferenceLine,{y:0.5,stroke:'#888',strokeDasharray:'5 4',label:{value:'P = 0.50',position:'insideTopRight',fontSize:10,fill:'#888'}}),
              React.createElement(Line,{type:'monotone',dataKey:'probability',stroke:'#2a78d6',strokeWidth:2,dot:false})
            )
          )
        ),
        result && React.createElement('div',{className:'card'},
          React.createElement('div',{className:'section-label'},'Parameter sensitivity — Spearman rank correlation with destructuration cycle'),
          React.createElement(ResponsiveContainer,{width:'100%',height:220},
            React.createElement(BarChart,{data:result.tornadoData,layout:'vertical',margin:{top:4,right:40,left:90,bottom:4}},
              React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:gridColor,horizontal:false}),
              React.createElement(XAxis,{type:'number',domain:[-1,1],tickFormatter:v=>v.toFixed(1),tick:{fontSize:11,fill:tickColor}}),
              React.createElement(YAxis,{type:'category',dataKey:'name',tick:{fontSize:11,fill:tickColor},width:86}),
              React.createElement(Tooltip,{formatter:(v)=>[v.toFixed(3),'Spearman ρ']}),
              React.createElement(ReferenceLine,{x:0,stroke:'#888'}),
              React.createElement(Bar,{dataKey:'correlation'},
                result.tornadoData.map((e,i)=>React.createElement(Cell,{key:i,fill:e.correlation>0?'#e24b4a':'#2a78d6'}))
              )
            )
          ),
          React.createElement('p',{className:'legend-note'},'Red → risk-increasing (higher value = earlier destructuration) · Blue → risk-reducing')
        ),
        result && React.createElement('div',{className:'summary-grid'},
          React.createElement('div',{className:'metric'},
            React.createElement('div',{className:'label'},'P(destructuration ≤ 50 cycles)'),
            React.createElement('div',{className:'value '+(result.pFail>0.5?'danger':'')}, (result.pFail*100).toFixed(1)+'%')
          ),
          React.createElement('div',{className:'metric'},
            React.createElement('div',{className:'label'},'Median cycle to destructuration'),
            React.createElement('div',{className:'value'}, result.medCycle!==null?result.medCycle:'> 50')
          ),
          React.createElement('div',{className:'metric'},
            React.createElement('div',{className:'label'},'Most influential parameter'),
            React.createElement('div',{className:'top-param'}, result.topParam)
          )
        )
      )
    ),
    React.createElement('footer',null,
      'Degradation law: Δb = −ξ · b · η · (Δs / (p',React.createElement('sub',null,'ref'),' + s',React.createElement('sub',null,'0'),')) · OCR',React.createElement('sup',null,'−κs'),
      ' · Fully destructured threshold: b ≤ 0.05 · Framework: S-CLAY1S (Wheeler et al. 2003)'
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
