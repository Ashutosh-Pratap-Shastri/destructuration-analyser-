<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probabilistic Destructuration Analyser — Structured Clays</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0f0e;color:#f0efec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;}
#app{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem;}
header{margin-bottom:2rem;border-bottom:1px solid #2c2c2a;padding-bottom:1.25rem;}
header h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#f0efec;}
header p{font-size:13px;color:#c3c2b7;}
header a{color:#5a9ee0;text-decoration:none;font-size:12px;}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start;}
@media(max-width:720px){.layout{grid-template-columns:1fr;}}
.card{background:#1a1a19;border:1px solid #2c2c2a;border-radius:12px;padding:1.25rem;}
.section-label{font-size:10px;font-weight:600;letter-spacing:0.07em;color:#898781;text-transform:uppercase;margin-bottom:14px;}
.slider-row{margin-bottom:18px;}
.slider-row .row-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.slider-row .lbl{font-size:12px;color:#c3c2b7;}
.slider-row .val{font-size:12px;font-weight:600;font-family:'Courier New',monospace;color:#f0efec;}
input[type=range]{width:100%;accent-color:#2a78d6;cursor:pointer;}
.run-btn{width:100%;padding:9px 0;margin-top:6px;background:#2a78d6;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.run-btn:hover{opacity:0.85;}
.run-btn:disabled{opacity:0.45;cursor:not-allowed;}
.output-col{display:flex;flex-direction:column;gap:16px;}
.placeholder{background:#1a1a19;border:1px solid #2c2c2a;border-radius:12px;padding:3rem 2rem;text-align:center;color:#898781;font-size:13px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:560px){.summary-grid{grid-template-columns:1fr;}}
.metric{background:#222220;border:1px solid #2c2c2a;border-radius:8px;padding:1rem;}
.metric .lbl{font-size:11px;color:#c3c2b7;margin-bottom:6px;}
.metric .val{font-size:22px;font-weight:600;font-family:'Courier New',monospace;color:#f0efec;}
.metric .val.danger{color:#e06c6c;}
.metric .top{font-size:14px;font-weight:600;color:#f0efec;}
.legend-note{font-size:11px;color:#898781;margin-top:8px;}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid #2c2c2a;font-size:12px;color:#898781;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const{useState,useCallback}=React;
const{LineChart,Line,BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,ReferenceLine,Cell,ResponsiveContainer}=Recharts;

function randn(){const u1=Math.random()+1e-12,u2=Math.random();return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}
function sampleLognormal(mean,cv){const s2=Math.log(1+cv*cv);return Math.exp(Math.log(mean)-s2/2+Math.sqrt(s2)*randn());}
function sampleNormalTruncated(mean,std){let v;do{v=mean+std*randn();}while(v<=0);return v;}
function sampleBeta(a,b,low,high){let x,y;do{x=Math.random()+1e-12;y=Math.random()+1e-12;}while(Math.pow(x,1/a)+Math.pow(y,1/b)>1);const beta=Math.pow(x,1/a)/(Math.pow(x,1/a)+Math.pow(y,1/b));return low+beta*(high-low);}
function ranks(arr){const sorted=[...arr].map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);const r=new Array(arr.length);sorted.forEach(([,idx],rank)=>r[idx]=rank+1);return r;}
function spearman(x,y){const n=x.length,rx=ranks(x),ry=ranks(y);let d2=0;for(let i=0;i<n;i++)d2+=(rx[i]-ry[i])**2;return 1-(6*d2)/(n*(n*n-1));}
function runMonteCarlo(params,N=1000,maxCycles=50){
  const p_ref=100,s_0=50,kappa_s=0.3,xi_mean=10.0,b_crit=0.05;
  const cyclesToFail=new Array(N).fill(maxCycles+1);
  const sp={b0:[],eta:[],ocr:[],ds:[],xi:[]};
  for(let i=0;i<N;i++){
    const b0=sampleBeta(2,2,0.5,1.0),eta=sampleLognormal(params.eta,0.25),
          ocr=sampleLognormal(params.ocr,0.15),ds=sampleNormalTruncated(params.ds,params.ds*0.20),
          xi=sampleLognormal(xi_mean,0.30);
    sp.b0.push(b0);sp.eta.push(eta);sp.ocr.push(ocr);sp.ds.push(ds);sp.xi.push(xi);
    let b=b0;
    for(let c=1;c<=maxCycles;c++){
      const dep=eta*(ds/(p_ref+s_0))*Math.pow(ocr,-kappa_s);
      b=Math.max(0,b+(-xi*b*dep));
      if(b<=b_crit){cyclesToFail[i]=c;break;}
    }
  }
  return{cyclesToFail,sp};
}

const GRID='#2c2c2a',TICK='#898781';

function SL({label,val,min,max,step,set,fmt}){
  return React.createElement('div',{className:'slider-row'},
    React.createElement('div',{className:'row-top'},
      React.createElement('span',{className:'lbl'},label),
      React.createElement('span',{className:'val'},fmt?fmt(val):val)
    ),
    React.createElement('input',{type:'range',min,max,step,value:val,onChange:e=>set(+e.target.value)})
  );
}

function App(){
  const[b0,setB0]=useState(0.75),[eta,setEta]=useState(0.05),[ocr,setOcr]=useState(15),[ds,setDs]=useState(80);
  const[result,setResult]=useState(null),[running,setRunning]=useState(false);

  const run=useCallback(()=>{
    setRunning(true);
    setTimeout(()=>{
      const N=1000,maxCycles=50;
      const{cyclesToFail,sp}=runMonteCarlo({eta,ocr,ds},N,maxCycles);
      const probCurve=Array.from({length:maxCycles},(_,i)=>({cycle:i+1,probability:+(cyclesToFail.filter(v=>v<=i+1).length/N).toFixed(4)}));
      const keys=['b0','eta','ocr','ds','xi'],labels=['Bond index b₀','Fissure density η','OCR','Suction Δs','Rate ξ'];
      const tornadoData=keys.map((k,i)=>({name:labels[i],correlation:+spearman(sp[k],cyclesToFail).toFixed(3)})).sort((a,b)=>Math.abs(b.correlation)-Math.abs(a.correlation));
      const failed=cyclesToFail.filter(v=>v<=maxCycles).sort((a,b)=>a-b);
      const pFail=+(failed.length/N).toFixed(3);
      const medCycle=failed.length>0?failed[Math.floor(failed.length/2)]:null;
      setResult({probCurve,tornadoData,pFail,medCycle,topParam:tornadoData[0].name});
      setRunning(false);
    },10);
  },[eta,ocr,ds]);

  return React.createElement('div',null,
    React.createElement('header',null,
      React.createElement('h1',null,'Probabilistic Destructuration Analyser'),
      React.createElement('p',null,'S-CLAY1S bond degradation framework · Monte Carlo (N = 1 000) · ',
        React.createElement('a',{href:'https://doi.org/10.1680/geot.2005.55.3.225',target:'_blank',rel:'noreferrer'},'Wheeler et al. 2003'))
    ),
    React.createElement('div',{className:'layout'},
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'section-label'},'Input parameters'),
        React.createElement(SL,{label:'Initial bond strength b₀',val:b0,min:0.5,max:1.0,step:0.05,set:setB0,fmt:v=>v.toFixed(2)}),
        React.createElement(SL,{label:'Fissure density η',val:eta,min:0.01,max:0.20,step:0.01,set:setEta,fmt:v=>v.toFixed(2)}),
        React.createElement(SL,{label:'Overconsolidation ratio (OCR)',val:ocr,min:2,max:30,step:1,set:setOcr}),
        React.createElement(SL,{label:'Suction amplitude Δs (kPa)',val:ds,min:10,max:200,step:10,set:setDs}),
        React.createElement('button',{className:'run-btn',onClick:run,disabled:running},running?'Running…':'Run Monte Carlo (N = 1 000)')
      ),
      React.createElement('div',{className:'output-col'},
        !result&&React.createElement('div',{className:'placeholder'},'Set parameters and click Run to see results.'),
        result&&React.createElement('div',{className:'card'},
          React.createElement('div',{className:'section-label'},'Probability of full destructuration vs. wetting-drying cycles'),
          React.createElement(ResponsiveContainer,{width:'100%',height:230},
            React.createElement(LineChart,{data:result.probCurve,margin:{top:6,right:20,bottom:20,left:0}},
              React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:GRID}),
              React.createElement(XAxis,{dataKey:'cycle',tick:{fontSize:11,fill:TICK},label:{value:'Wetting-drying cycle',position:'insideBottom',offset:-12,fontSize:11,fill:TICK}}),
              React.createElement(YAxis,{domain:[0,1],tickFormatter:v=>v.toFixed(1),tick:{fontSize:11,fill:TICK},label:{value:'P(destructuration)',angle:-90,position:'insideLeft',offset:14,fontSize:11,fill:TICK}}),
              React.createElement(Tooltip,{contentStyle:{background:'#222220',border:'1px solid #3a3a38',borderRadius:6,fontSize:12},formatter:v=>[v.toFixed(3),'P'],labelFormatter:l=>'Cycle '+l}),
              React.createElement(ReferenceLine,{y:0.5,stroke:'#666',strokeDasharray:'5 4',label:{value:'P = 0.50',position:'insideTopRight',fontSize:10,fill:'#888'}}),
              React.createElement(Line,{type:'monotone',dataKey:'probability',stroke:'#5a9ee0',strokeWidth:2,dot:false})
            )
          )
        ),
        result&&React.createElement('div',{className:'card'},
          React.createElement('div',{className:'section-label'},'Parameter sensitivity — Spearman rank correlation with destructuration cycle'),
          React.createElement(ResponsiveContainer,{width:'100%',height:220},
            React.createElement(BarChart,{data:result.tornadoData,layout:'vertical',margin:{top:4,right:40,left:90,bottom:4}},
              React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:GRID,horizontal:false}),
              React.createElement(XAxis,{type:'number',domain:[-1,1],tickFormatter:v=>v.toFixed(1),tick:{fontSize:11,fill:TICK}}),
              React.createElement(YAxis,{type:'category',dataKey:'name',tick:{fontSize:11,fill:TICK},width:86}),
              React.createElement(Tooltip,{contentStyle:{background:'#222220',border:'1px solid #3a3a38',borderRadius:6,fontSize:12},formatter:v=>[v.toFixed(3),'Spearman ρ']}),
              React.createElement(ReferenceLine,{x:0,stroke:'#666'}),
              React.createElement(Bar,{dataKey:'correlation'},
                result.tornadoData.map((e,i)=>React.createElement(Cell,{key:i,fill:e.correlation>0?'#e06c6c':'#5a9ee0'}))
              )
            )
          ),
          React.createElement('p',{className:'legend-note'},'Red → risk-increasing (higher value = earlier destructuration) · Blue → risk-reducing')
        ),
        result&&React.createElement('div',{className:'summary-grid'},
          React.createElement('div',{className:'metric'},
            React.createElement('div',{className:'lbl'},'P(destructuration ≤ 50 cycles)'),
            React.createElement('div',{className:'val '+(result.pFail>0.5?'danger':'')},(result.pFail*100).toFixed(1)+'%')
          ),
          React.createElement('div',{className:'metric'},
            React.createElement('div',{className:'lbl'},'Median cycle to destructuration'),
            React.createElement('div',{className:'val'},result.medCycle!==null?result.medCycle:'> 50')
          ),
          React.createElement('div',{className:'metric'},
            React.createElement('div',{className:'lbl'},'Most influential parameter'),
            React.createElement('div',{className:'top'},result.topParam)
          )
        )
      )
    ),
    React.createElement('footer',null,
      'Degradation law: Δb = −ξ · b · η · (Δs / (p\u209c\u2091\u2092 + s\u2080)) · OCR\u207b\u1da8\u209b · Threshold: b ≤ 0.05 · S-CLAY1S (Wheeler et al. 2003)'
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
